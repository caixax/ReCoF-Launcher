name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: No em dashes and no en dashes
        run: cargo run --package xtask -- check-dashes

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --target x86_64-pc-windows-msvc

      - name: Release build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Report binary size
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/ReCoF-Launcher.exe"
          $size = (Get-Item $exe).Length
          "ReCoF-Launcher.exe: $size bytes ($([math]::Round($size/1MB,2)) MiB)" |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - uses: actions/upload-artifact@v4
        with:
          name: ReCoF-Launcher-unsigned
          path: target/x86_64-pc-windows-msvc/release/ReCoF-Launcher.exe
          if-no-files-found: error
