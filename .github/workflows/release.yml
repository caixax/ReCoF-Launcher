name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: No em dashes and no en dashes
        run: cargo run --package xtask -- check-dashes

      - name: Tests
        run: cargo test --workspace --target x86_64-pc-windows-msvc

      - name: Release build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Version from the tag
        id: version
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME -like "v*") { $env:GITHUB_REF_NAME } else { "${{ inputs.tag }}" }
          $version = $tag.TrimStart("v")
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          # A version with a prerelease part (1.1.0-beta.1) is a beta: its
          # manifest says so and the GitHub release is marked as one, which
          # keeps it off the stable channel.
          $beta = $version.Contains("-")
          "channel=$(if ($beta) { 'beta' } else { 'stable' })" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$($beta.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          # The tag and Cargo.toml must agree, or the launcher would
          # report a version that is not the one that was released.
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' |
                    Select-Object -First 1).Matches.Groups[1].Value
          if ($cargo -ne $version) {
            throw "the tag says $version but Cargo.toml says $cargo"
          }

      # Writes the archive, its manifest and the Ed25519 signature into
      # dist/. The private key lives only in this secret and never in the
      # tree.
      - name: Pack and sign
        env:
          RECOF_LAUNCHER_SIGNING_KEY: ${{ secrets.RECOF_LAUNCHER_SIGNING_KEY }}
        run: >
          cargo run --package xtask --
          pack-launcher
          --exe target/x86_64-pc-windows-msvc/release/ReCoF-Launcher.exe
          --version ${{ steps.version.outputs.version }}
          --channel ${{ steps.version.outputs.channel }}
          --out dist

      # The runner images ship NSIS; installing it is only the fallback.
      - name: NSIS
        shell: pwsh
        run: |
          $found = (Get-Command makensis -ErrorAction SilentlyContinue) -or
                   (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")
          if (-not $found) { choco install nsis -y --no-progress }

      - name: Installer
        run: >
          cargo run --package xtask --
          pack-installer
          --exe target/x86_64-pc-windows-msvc/release/ReCoF-Launcher.exe
          --version ${{ steps.version.outputs.version }}
          --out dist

      - name: Report binary size
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/ReCoF-Launcher.exe"
          $size = (Get-Item $exe).Length
          "ReCoF-Launcher.exe: $size bytes ($([math]::Round($size/1MB,2)) MiB)" |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            dist/ReCoF-Launcher-${{ steps.version.outputs.version }}-setup.exe
            target/x86_64-pc-windows-msvc/release/ReCoF-Launcher.exe
            dist/recof-launcher-${{ steps.version.outputs.version }}.zip
            dist/recof-launcher-manifest.json
            dist/recof-launcher-manifest.json.sig
          body: |
            ## Downloads

            - **`ReCoF-Launcher-${{ steps.version.outputs.version }}-setup.exe`**: the installer. It installs for your Windows user only, needs no administrator rights, adds a Start menu entry, and can be removed from the list of installed apps.
            - **`ReCoF-Launcher.exe`**: the portable launcher. One file, nothing to install: put it in any folder you can write to and run it.

            Either one updates itself from here. `recof-launcher-${{ steps.version.outputs.version }}.zip`, `recof-launcher-manifest.json` and `recof-launcher-manifest.json.sig` are what the launcher downloads and checks when it does, so you do not need them.

            The executables are not code signed yet, so Windows SmartScreen may warn the first time: "More info", then "Run anyway".
          generate_release_notes: true
